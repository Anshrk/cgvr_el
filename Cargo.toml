[package]
name = "cgvr"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu       = "30"
winit      = "0.30"
pollster   = "1.0"
bytemuck   = { version = "1.25", features = ["derive"] }
glam       = { version = "0.34", features = ["bytemuck"] }
rand       = "0.10"
egui       = { version = "0.37", features = ["default_fonts"] }
egui-wgpu  = "0.37"
egui-winit = "0.37"
